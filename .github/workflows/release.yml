name: Build and Release XBPS Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version string to release (e.g. v0.1.0 or latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: |
          go test -v ./...

      - name: Determine Version and Tag
        id: version
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG_NAME="latest"
          else
            TAG_NAME="latest"
          fi

          if [ "${TAG_NAME}" = "latest" ]; then
            BASE_VER="$(grep '^version=' template | cut -d'=' -f2)"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="${BASE_VER}"
          else
            if [[ "${TAG_NAME}" != v* ]]; then
              TAG_NAME="v${TAG_NAME}"
            fi
            VERSION="${TAG_NAME#v}"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using TAG_NAME=${TAG_NAME}, VERSION=${VERSION}"

      - name: Build Standalone Go Binary
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/vpm .
          tar -czvf dist/vpm-linux-amd64.tar.gz -C dist vpm

      - name: Build XBPS Package via Docker (Void Linux)
        run: |
          chmod +x .github/scripts/build-xbps.sh
          docker run --privileged --userns=host --security-opt seccomp=unconfined --security-opt apparmor=unconfined --rm \
            -e VERSION="${{ env.VERSION }}" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/void-linux/void-linux:latest-full-x86_64 \
            sh /workspace/.github/scripts/build-xbps.sh


      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release & Upload Assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          TAG="${{ env.TAG_NAME }}"
          
          if gh release view "${TAG}" &>/dev/null; then
            echo "==> Release ${TAG} already exists. Uploading/updating assets..."
            gh release upload "${TAG}" ./* --clobber
          else
            echo "==> Creating new GitHub Release ${TAG}..."
            PRERELEASE_FLAG=""
            if [ "${TAG}" = "latest" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            gh release create "${TAG}" ./* \
              --title "voidPM ${TAG}" \
              ${PRERELEASE_FLAG} \
              --generate-notes
          fi
